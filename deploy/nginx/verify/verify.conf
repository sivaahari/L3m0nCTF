# The participant verification portal: https://verify.<domain>/<CODE> (docs/runbooks/22-verify-portal.md).
#
# This file is in the nginx container ONLY when the `verify` overlay is on (deploy/compose/compose.verify.yml mounts it at
# /etc/nginx/verify.d/verify.conf and the generated website, read-only, at /srv/verify); templates-production/platform.conf.template includes
# /etc/nginx/verify.d/*.conf, a folder that holds nothing otherwise.
#
# The website is static: `python -m l3mon verify build` writes it from the credentials database. nginx only reads files; nothing here reaches
# CTFd, and no request can write anything. Every address that is not one of the routes below gets the "No signal" page.
# Who may connect: only Cloudflare, exactly as for the platform (the client certificate is checked in the TLS handshake). This block answers only
# the exact name verify.l3m0nctf.xyz (anchored at both ends, as the beginner block): Cloudflare's origin-pull certificate is shared by all of its
# customers, so a name that merely STARTS with `verify.` on somebody else's zone must not be served our certificates. A different domain means
# editing the one `server_name` line below.

server {
  listen 8443 ssl;
  server_name "~^verify\.l3m0nctf\.xyz$";

  # the same TLS settings as the platform's block (tools/tests/test_verify_nginx.py keeps the two equal)
  ssl_certificate         /etc/nginx/tls/origin.pem;
  ssl_certificate_key     /etc/nginx/tls/origin.key;
  ssl_client_certificate  /etc/nginx/tls/cloudflare-origin-pull-ca.pem;
  ssl_verify_client       on;
  ssl_protocols           TLSv1.2;
  ssl_prefer_server_ciphers off;
  ssl_session_cache       shared:SSL:10m;
  ssl_session_timeout     1h;
  ssl_session_tickets     off;

  root /srv/verify;
  charset utf-8;
  # nginx listens on 8443 behind Cloudflare's 443: a redirect must stay relative, or it would send the visitor to :8443
  absolute_redirect off;
  # the portal's headers on every answer this block makes itself (the 302 of /check, a 405, a 429); a location that adds headers of its own
  # includes the same snippet again, because nginx then drops the inherited ones
  include /etc/nginx/snippets/verify-headers.conf;
  client_max_body_size 1k;
  limit_req zone=verify burst=30 nodelay;
  limit_conn perip 40;
  error_page 404 /404.html;
  # a rate-limited answer gets its own page with no-store: it must never inherit a location's long cache (a stylesheet's year)
  error_page 429 /429.html;

  # only reading: any other method is refused before a file is looked at
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  location = / {
    include /etc/nginx/snippets/verify-headers.conf;
    add_header Cache-Control "public, max-age=300" always;
    try_files /index.html =404;
  }

  # a certificate: exactly the canonical code (capitals and dashes, as printed and in the QR code). An organiser's five may be any capitals or
  # digits (permanent codes given out before the tool); the others are the tool's 21 consonants (tools/l3mon/verify/codes.py ROUTE). Other spellings reach the 404 page, whose
  # script sends the visitor to the canonical address once.
  location ~ "^/(L3M0N26-(?:ORG-[ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789]{5}|(?:PAR|ACH|APP)-[BCDFGHJKLMNPQRSTVWXYZ]{5}))$" {
    include /etc/nginx/snippets/verify-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "public, max-age=300" always;
    default_type text/html;
    try_files /c/$1.html =404;
  }

  # a certificate's PDF (`verify build --certificate`): the same code rule; c/<CODE>.pdf exists only for a valid code of a category the build
  # printed, so any other code (withdrawn, replaced, no design) gets the "No signal" page. Shown in the browser's own viewer, saved under a clear name.
  # A NAMED capture: the headers are made after the regex map behind $hsts has run, and that would overwrite a numbered $1 (an empty file name).
  location ~ "^/(?<cert_code>L3M0N26-(?:ORG-[ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789]{5}|(?:PAR|ACH|APP)-[BCDFGHJKLMNPQRSTVWXYZ]{5}))/certificate\.pdf$" {
    include /etc/nginx/snippets/verify-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Content-Disposition 'inline; filename="L3m0n-CTF-2026-$cert_code.pdf"' always;
    types { }
    default_type application/pdf;
    try_files /c/$cert_code.pdf =404;
  }

  # the lookup form without JavaScript: a code typed exactly as printed goes to its page, anything else gets "No signal"
  location = /check {
    if ($arg_code ~ "^(L3M0N26-(?:ORG-[ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789]{5}|(?:PAR|ACH|APP)-[BCDFGHJKLMNPQRSTVWXYZ]{5}))$") { return 302 /$1; }
    return 404;
  }

  # hashed file names never change: cache them for a year; the favicon and the logos' names are content-hashed or tiny
  location /assets/ {
    include /etc/nginx/snippets/verify-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    include /etc/nginx/snippets/verify-headers.conf;
    try_files $uri =404;
  }

  location = /404.html {
    internal;
    include /etc/nginx/snippets/verify-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
  }

  location = /429.html {
    internal;
    include /etc/nginx/snippets/verify-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
  }

  # everything else (the c/ folder itself, build.json, any guess) does not exist
  location / {
    return 404;
  }
}
