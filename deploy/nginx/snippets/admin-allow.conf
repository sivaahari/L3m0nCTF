# Who may open /admin. This is the DEVELOPMENT list: this computer and private networks (Docker's own bridge shows up
# as a private address). Production mounts its own file over this one, with only the organisers' addresses.
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
deny all;
