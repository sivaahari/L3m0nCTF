# The platform's server block, everything inside it except the lines that say how it listens (the port, the TLS settings and the server name).
# Included by templates/platform.conf.template (development and tests: plain HTTP on 8080) and by templates-production/platform.conf.template
# (production: HTTPS on 8443 behind Cloudflare), so there is one copy of the rules and the two cannot drift apart.

  include /etc/nginx/snippets/security-headers.conf;
  limit_req zone=general burst=200 nodelay;
  limit_conn perip 300;
  # The administrator surface and multipart bodies are for the organisers' addresses only (nginx.conf explains the rules).
  # These refusals happen before nginx reads the body, so nothing reaches CTFd.
  if ($api_denied)       { return 403; }
  if ($multipart_denied) { return 415; }

  # Level 3 maintenance check: active when flag file exists, unless bypassed (crew or exempt route)
  set $maint_trigger 0;
  if (-f /etc/l3mon/maintenance) {
    set $maint_trigger 1;
  }
  if ($maintenance_bypassed = 1) {
    set $maint_trigger 0;
  }
  if ($maint_trigger = 1) {
    return 503;
  }

  # Error pages for busy / maintenance (503) and upstream down (502, 504)
  error_page 503 @slate_503;
  error_page 502 504 @slate_down;

  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 60s;

  # The container's own health check. Reachable only from inside the container.
  location = /__nginx_health {
    allow 127.0.0.1;
    deny all;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Health routes: never cached, no cookie (CTFd starts an anonymous session on every request, which has no place here).
  location = /healthcheck {
    limit_req zone=general burst=200 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store" always;
    access_log off;
  }
  location = /l3mon/healthz {
    limit_req zone=general burst=200 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store" always;
    access_log off;
  }
  location = /readyz {
    limit_req zone=general burst=200 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store" always;
    access_log off;
  }

  # Metrics endpoint: internal network only (nginx answers 404 to everyone)
  location = /l3mon/metrics {
    return 404;
  }

  # Internal stub_status for nginx exporter
  location = /__nginx_status {
    stub_status;
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    deny all;
    access_log off;
  }

  # Public static error slates and assets
  location ^~ /slates/ {
    alias /etc/nginx/snippets/slates/;
    add_header Cache-Control "public, max-age=3600" always;
    include /etc/nginx/snippets/security-headers.conf;
  }
  location = /slates/maintenance.json {
    alias /etc/l3mon/maintenance;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The public CTFtime feeds (plugin l3mon_ctftime): the same answer for everybody, so no cookie (CTFd starts an anonymous
  # session on every request, which must not be sent here or cached with the answer) and no "Vary: Cookie". The plugin
  # sets the cache lifetime.
  location /ctftime/ {
    limit_req zone=general burst=200 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Vary;
  }

  # Sign-in, registration and password reset: slow down guessing from one address.
  location = /login {
    limit_req zone=general burst=200 nodelay;
    limit_req zone=login burst=40 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
  }
  location ~ ^/(register|reset_password|confirm)(/|$) {
    limit_req zone=general burst=200 nodelay;
    limit_req zone=login burst=40 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
  }
  # CTFd's own OAuth sign-in (for another provider) finds accounts by email, marks them verified and shares the id columns with Login with
  # CTFtime (plugin l3mon_ctftime, /auth/ctftime, which is rate limited by the plugin: nginx's login zone counts only POSTs). It is not used here.
  location = /oauth    { return 404; }
  location = /redirect { return 404; }

  # Flag submission: generous per address, because a whole campus can share one.
  # Separate concurrency cap (Level 1 busy mode) so flag submissions are never starved by page loads.
  location = /api/v1/challenges/attempt {
    limit_conn_status 503;
    limit_conn perip 300;  # a limit_conn in a location replaces the server block's, so the per-address cap is repeated here
    limit_conn app_flags 60;
    limit_req zone=general burst=200 nodelay;
    limit_req zone=flags burst=120 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Live notifications (server-sent events): long-lived, unbuffered, few per visitor.
  location = /events {
    limit_conn perip 150;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding off;
    proxy_read_timeout 1h;
  }

  # The admin pages: only from the organisers' addresses (the list is a file that production replaces).
  location ^~ /admin {
    if ($admin_net = 0) { return 403; }
    client_max_body_size 10m;
    limit_req zone=general burst=200 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
  }

  # Uploading challenge files. Administrators only: this route is on the generated admin list, so any other address is
  # refused at the top of this server block before the body is read. The only place besides /admin that takes more than 64k.
  location = /api/v1/files {
    client_max_body_size 10m;
    limit_req zone=general burst=200 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
  }

  location / {
    limit_conn_status 503;
    limit_conn perip 300;  # a limit_conn in a location replaces the server block's, so the per-address cap is repeated here
    limit_conn app_general 250;
    limit_req zone=general burst=200 nodelay;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/proxy.conf;
  }

  location @slate_503 {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "15" always;
    add_header X-Request-ID $request_id always;

    if ($is_api_request) {
      return 503 '{"error": "busy", "retry_after": 15}\n';
    }

    set $slate_file "/busy.html";
    if (-f /etc/l3mon/maintenance) {
      set $slate_file "/maintenance.html";
    }

    root /etc/nginx/snippets;
    sub_filter '__REQUEST_ID__' $request_id;
    sub_filter_once on;
    rewrite ^ /slates$slate_file break;
  }

  location @slate_down {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
    add_header X-Request-ID $request_id always;

    if ($is_api_request) {
      return 502 '{"error": "restarting"}\n';
    }

    root /etc/nginx/snippets;
    sub_filter '__REQUEST_ID__' $request_id;
    sub_filter_once on;
    rewrite ^ /slates/down.html break;
  }
