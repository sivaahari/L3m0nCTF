# Routes the platform's own plugins keep for the crew, for every method. Hand-kept (api-admin-routes.conf is generated from CTFd's
# own source and cannot know these). A request to one of them is "administrator surface": nginx answers it only for the
# organisers' addresses, before it reaches CTFd, which then checks the administrator session or token as well.
#
# api-player-writes-l3mon.conf lets players write under /api/v1/l3mon/; this list wins over it (an administrator route is
# refused whatever the player-writes list says), so the crew's calls are never open to players by that wildcard.
"~^[A-Z]+:/api/v1/l3mon/admin(/.*)?$" 1;
