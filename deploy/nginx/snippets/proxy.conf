# How nginx talks to CTFd. Included in every proxied location.
proxy_pass http://ctfd_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The visitor's address as nginx resolved it (the Cloudflare header, only from Cloudflare). Never "add to" what the
# visitor sent: a made-up X-Forwarded-For must not reach CTFd.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Prefix "";
proxy_redirect off;
# The headers nginx sets itself (security-headers.conf) must not appear twice.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;
