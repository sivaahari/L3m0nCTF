# How nginx talks to CTFd. Included in every proxied location.
proxy_pass http://ctfd_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# The visitor's address as nginx resolved it (the Cloudflare header, only from Cloudflare). Never "add to" what the
# visitor sent: a made-up X-Forwarded-For must not reach CTFd.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Prefix "";
proxy_redirect off;
# Flask 2.1.3 (the version CTFd 3.8.8 is tested with) can leave out "Vary: Cookie" on some responses (CVE-2023-30861), which
# matters only to a shared cache. There is none in our nginx, but we say it anyway so a cache added later cannot mix visitors up.
add_header Vary "Cookie" always;
# The headers nginx sets itself (security-headers.conf) must not appear twice.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header X-Powered-By;
