# Security headers for every response. Included again in every location, because nginx drops inherited add_header
# lines as soon as a location sets one of its own.
# The Content-Security-Policy arrives with the real theme (it needs the theme's script and style sources).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Only when the visitor came in over HTTPS (Cloudflare tells us); an empty value is not sent.
add_header Strict-Transport-Security $hsts always;
