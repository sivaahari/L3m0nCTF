# Who counts as an organiser's address: the lines of a `geo $admin_net` block (value 1 = allowed). This is the DEVELOPMENT
# list: this computer and private networks (Docker's own bridge shows up as a private address). Production mounts its own
# file over this one (see admin-nets.production.example.conf): ONLY the organisers' addresses, never a private range.
127.0.0.1 1;
::1 1;
10.0.0.0/8 1;
172.16.0.0/12 1;
192.168.0.0/16 1;
