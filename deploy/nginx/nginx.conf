# nginx for the L3m0nCTF platform: the only service that listens for the outside world.
# Runs as an unprivileged user (nginxinc/nginx-unprivileged), listens on 8080, writes only to tmpfs.
# The server block is rendered from templates/platform.conf.template into /etc/nginx/conf.d at start-up.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  keepalive_requests 1000;

  # Writable paths live in /tmp (a tmpfs); the root file system is read-only.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Small bodies only: flags, logins and forms. Challenge files are downloaded, never uploaded by players, so a body over 64k
  # is refused everywhere except the admin pages and the files API (10m, see platform.conf.template; both only for the
  # organisers' addresses). Multipart bodies from other addresses are refused outright (see $multipart_denied below).
  client_max_body_size 64k;
  client_body_buffer_size 128k;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 30s;
  large_client_header_buffers 4 16k;

  # The log never carries the query string ($uri, not $request_uri), because tokens can travel there. Password-reset and
  # email-confirmation links carry their token in the PATH, so that part is masked too.
  map $uri $log_uri {
    default $uri;
    "~^(?<link>/(?:reset_password|confirm))/.+" "$link/[token]";
  }
  log_format main '$remote_addr "$request_method $log_uri" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time ua="$http_user_agent"';
  access_log /dev/stdout main;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Who a visitor really is: Cloudflare's CF-Connecting-IP header, trusted only when the request comes from Cloudflare.
  include /etc/nginx/snippets/cloudflare-realip.conf;

  # The organisers' addresses (geo: 1 = organiser) and the addresses the per-address limits skip (the campus, for the finals).
  geo $admin_net     { default 0; include /etc/nginx/snippets/admin-nets.conf; }
  geo $unlimited_net { default 0; include /etc/nginx/snippets/unlimited-nets.conf; }

  # The administrator surface (docs/security/dependency-bumps.md, tools/l3mon/api_rules.py): the REST API is where almost
  # every administrator action happens, and it is reachable at any address, so nginx answers these requests only for the
  # organisers' addresses:
  #   - any request that carries an Authorization header (API tokens are for organisers and tools, not players' browsers)
  #   - any route CTFd itself guards with @admins_only
  #   - any write (POST, PUT, PATCH, DELETE) that is not one of the few writes a player makes. This fails closed: a write
  #     route added later is admin-only until it is listed.
  map "$request_method:$uri" $api_admin_route  { default 0; include /etc/nginx/snippets/api-admin-routes.conf; }
  map "$request_method:$uri" $api_player_write { default 0; include /etc/nginx/snippets/api-player-writes.conf; include /etc/nginx/snippets/api-player-writes-l3mon.conf; }
  map "$uri:$request_method" $api_is_write { default 0; "~^/api/.*:(POST|PUT|PATCH|DELETE)$" 1; }
  map $http_authorization $api_has_token { default 1; "" 0; }
  # the four digits: has a token, admin-only route, is a write to /api, is a player write
  map "$api_has_token$api_admin_route$api_is_write$api_player_write" $api_admin_surface {
    default 0;
    "~^1"   1;
    "~^.1"  1;
    "~^..10" 1;
  }
  map "$admin_net$api_admin_surface" $api_denied { default 0; "01" 1; }
  # CTFd parses the form of every non-JSON POST before it checks who is asking (its CSRF check), and Werkzeug's multipart
  # parser can be made to work hard (CVE-2023-46136, CVE-2024-49767). Players never upload anything, so multipart bodies
  # are refused for every address that is not an organiser's.
  map $content_type $is_multipart { default 0; "~*^multipart/" 1; }
  map "$admin_net$is_multipart" $multipart_denied { default 0; "01" 1; }

  # Limits per visitor address. Many players can share one address (a campus, a mobile carrier), so the limits only stop
  # floods; CTFd's own per-account limits stay authoritative. Addresses in unlimited-nets.conf are not limited at all
  # (an empty key is skipped by nginx).
  map $unlimited_net $limit_addr { 1 ""; default $binary_remote_addr; }
  map "$request_method$unlimited_net" $login_limit_key { default ""; "POST0" $binary_remote_addr; }
  map "$request_method$unlimited_net" $flag_limit_key  { default ""; "POST0" $binary_remote_addr; }
  limit_req_zone $limit_addr      zone=general:10m rate=100r/s;
  limit_req_zone $login_limit_key zone=login:10m   rate=120r/m;
  limit_req_zone $flag_limit_key  zone=flags:10m   rate=1200r/m;
  limit_conn_zone $limit_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
  map $http_x_forwarded_proto $hsts            { default ""; https "max-age=31536000; includeSubDomains"; }

  upstream ctfd_app {
    server ctfd:8000;
    keepalive 64;
  }

  include /etc/nginx/conf.d/*.conf;
}
