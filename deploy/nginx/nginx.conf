# nginx for the L3m0nCTF platform: the only service that listens for the outside world.
# Runs as an unprivileged user (nginxinc/nginx-unprivileged), listens on 8080, writes only to tmpfs.
# The server block is rendered from templates/platform.conf.template into /etc/nginx/conf.d at start-up.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  keepalive_requests 1000;

  # Writable paths live in /tmp (a tmpfs); the root file system is read-only.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Small bodies only: flags, logins and forms. Challenge files are downloaded, never uploaded by players. Only the admin
  # pages and the files API (see platform.conf.template) may take up to 10m. This also caps the work Werkzeug's multipart
  # parser can be made to do (CVE-2023-46136, CVE-2024-49767; docs/security/dependency-bumps.md).
  client_max_body_size 1m;
  client_body_buffer_size 128k;
  client_header_timeout 15s;
  client_body_timeout 30s;
  send_timeout 30s;
  large_client_header_buffers 4 16k;

  # The log never carries the query string ($uri, not $request_uri), because tokens can travel there.
  log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time ua="$http_user_agent"';
  access_log /dev/stdout main;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Who a visitor really is: Cloudflare's CF-Connecting-IP header, trusted only when the request comes from Cloudflare.
  include /etc/nginx/snippets/cloudflare-realip.conf;

  # Limits per visitor address. An address shared by a whole campus is why the flag limit is generous: the per-account
  # limits inside CTFd stay authoritative, and these only stop floods.
  map $request_method $login_limit_key { default ""; POST $binary_remote_addr; }
  map $request_method $flag_limit_key  { default ""; POST $binary_remote_addr; }
  limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
  limit_req_zone $login_limit_key    zone=login:10m   rate=10r/m;
  limit_req_zone $flag_limit_key     zone=flags:10m   rate=300r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
  map $http_x_forwarded_proto $hsts            { default ""; https "max-age=31536000; includeSubDomains"; }

  upstream ctfd_app {
    server ctfd:8000;
    keepalive 64;
  }

  include /etc/nginx/conf.d/*.conf;
}
