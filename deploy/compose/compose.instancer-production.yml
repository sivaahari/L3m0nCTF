# Production overlay for per-team challenge instances and dynamic flags (SP4).
# Used via:
#   L3MON_ENV=production L3MON_OVERLAYS=instancer,instancer-production tools/compose.sh up -d --wait
#
# Production differences:
#   instancer:
#     - INSTANCER_DEV is forced to "0" (no dev shortcuts, unpinned images refused, ttl override refused).
#     - Manifest is mounted read-only from outside the repository (default: /etc/l3mon/challenges.toml).
#   router:
#     - Published on public router interface (${ROUTER_BIND_HOST:-0.0.0.0}:${ROUTER_HTTP_PORT:-8090}:8090).
#     - Instance domain is required and configured from ${INSTANCE_DOMAIN} without localhost default.
#     - Optional TLS files mounted read-only if used (${ROUTER_TLS_DIR:-/etc/l3mon/router-tls}).

services:
  ctfd:
    volumes:
      - ${L3MON_HOSTS_FILE:-/etc/l3mon/hosts.json}:/etc/l3mon/hosts.json:ro
    environment:
      L3MON_HOSTS_PATH: /etc/l3mon/hosts.json
    secrets:
      - INSTANCER_TOKEN_H1

  instancer:
    volumes:
      - ${INSTANCER_MANIFEST_FILE:-/etc/l3mon/challenges.toml}:/etc/instancer/challenges.toml:ro
    environment:
      INSTANCER_DEV: "0"
      INSTANCER_INSTANCE_POOL: "${INSTANCER_INSTANCE_POOL:?INSTANCER_INSTANCE_POOL must be set in production}"

  router:
    ports: !override
      - "${ROUTER_BIND_HOST:-0.0.0.0}:${ROUTER_HTTP_PORT:-8090}:8090"
      - "${ROUTER_BIND_HOST:-0.0.0.0}:30000-30199:30000-30199"
    environment:
      INSTANCE_DOMAIN: "${INSTANCE_DOMAIN:?INSTANCE_DOMAIN must be set}"
      INSTANCER_INSTANCE_POOL: "${INSTANCER_INSTANCE_POOL:?INSTANCER_INSTANCE_POOL must be set in production}"
      ROUTER_HOSTS_PATH: /etc/l3mon/hosts.json
    volumes:
      - ${ROUTER_TLS_DIR:-/etc/l3mon/router-tls}:/etc/router/tls:ro
      - ${L3MON_HOSTS_FILE:-/etc/l3mon/hosts.json}:/etc/l3mon/hosts.json:ro
    secrets:
      - ROUTER_TOKEN_H1

secrets:
  INSTANCER_TOKEN_H1:
    file: ${INSTANCER_TOKEN_H1_FILE:-/etc/l3mon/secrets/INSTANCER_TOKEN_H1}
  ROUTER_TOKEN_H1:
    file: ${ROUTER_TOKEN_H1_FILE:-/etc/l3mon/secrets/ROUTER_TOKEN_H1}


