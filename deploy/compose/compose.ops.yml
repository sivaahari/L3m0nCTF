# Operations & resilience overlay: compose.ops.yml
# Used with: L3MON_OVERLAYS=ops tools/compose.sh up -d --wait

services:
  nginx:
    volumes:
      - ${MAINTENANCE_DIR:-../ops/maintenance}:/etc/l3mon:ro
    networks:
      - edge
      - ops

  ctfd:
    environment:
      MAIL_SERVER: mail-relay
      MAIL_PORT: "25"
      MAIL_USEAUTH: ""
      MAIL_TLS: ""
      MAIL_SSL: ""
      MAILFROM_ADDR: "${MAILFROM_ADDR:-no-reply@l3m0nctf.xyz}"
      TRUSTED_HOSTS: "${PLATFORM_HOST},${EXTRA_HOST:-${PLATFORM_HOST}},ctfd,localhost"
    networks:
      - internal
      - edge
      - ops

  mail-relay:
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
    command: ["python", "-u", "/app/relay.py"]
    volumes:
      - ../ops/mail/relay.py:/app/relay.py:ro
      - mail_spool:/var/spool/l3mon-mail
    tmpfs:
      - /tmp
    environment:
      SMTP_HOST: "0.0.0.0"
      SMTP_PORT: "25"
      METRICS_PORT: "9025"
      SPOOL_DIR: "/var/spool/l3mon-mail"
      UPSTREAM_SMTP_HOST: "${UPSTREAM_SMTP_HOST:-}"
      UPSTREAM_SMTP_PORT: "${UPSTREAM_SMTP_PORT:-587}"
      UPSTREAM_SMTP_USER: "${UPSTREAM_SMTP_USER:-}"
      UPSTREAM_SMTP_TLS: "${UPSTREAM_SMTP_TLS:-true}"
      UPSTREAM_SMTP_SSL: "${UPSTREAM_SMTP_SSL:-false}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-30}"
      RATE_LIMIT_PER_DAY: "${RATE_LIMIT_PER_DAY:-500}"
      MAIL_PASSWORD_FILE: "/run/secrets/MAIL_PASSWORD"
    secrets: [MAIL_PASSWORD]
    networks: [internal, ops]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9025/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mail-catcher:
    profiles: [test-mail]
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
    command: ["python", "-u", "/app/catcher.py"]
    volumes:
      - ../ops/mail/catcher.py:/app/catcher.py:ro
    tmpfs:
      - /tmp
    networks: [internal]
    mem_limit: 128m
    pids_limit: 64

  # --- Monitoring Stack ---

  prometheus:
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ../ops/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    tmpfs:
      - /tmp
    networks:
      - ops
      - internal
      - edge
    depends_on:
      ctfd: { condition: service_healthy }
      alertmanager: { condition: service_started }
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  alertmanager:
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -s /run/secrets/DISCORD_WEBHOOK_URL ] && [ -n "$$(cat /run/secrets/DISCORD_WEBHOOK_URL | tr -d '[:space:]')" ]; then
          exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
        else
          exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager-nowebhook.yml --storage.path=/alertmanager
        fi
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../ops/alertmanager:/etc/alertmanager:ro
    tmpfs:
      - /tmp
      - /alertmanager
    secrets:
      - DISCORD_WEBHOOK_URL
    networks:
      - ops
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  grafana:
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "472:472"
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD__FILE: "/run/secrets/GRAFANA_ADMIN_PASSWORD"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PATHS_PROVISIONING: "/etc/grafana/provisioning"
    volumes:
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /tmp
      - /var/lib/grafana
    secrets:
      - GRAFANA_ADMIN_PASSWORD
    networks:
      - ops
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  loki:
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    image: grafana/loki:3.1.1@sha256:e689cc634841c937de4d7ea6157f17e29cf257d6a320f1c293ab18d46cfea986
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ../ops/loki:/etc/loki:ro
      - loki_data:/loki
    tmpfs:
      - /tmp
    networks:
      - ops
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  blackbox-exporter:
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    image: prom/blackbox-exporter:v0.25.0@sha256:b04a9fef4fa086a02fc7fcd8dcdbc4b7b35cc30cdee860fdc6a19dd8b208d63e
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ../ops/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    tmpfs:
      - /tmp
    networks:
      - ops
      - edge
      - internal
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx-exporter:
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    image: nginx/nginx-prometheus-exporter:1.3.0@sha256:6477cf3bddc4e042d3496856fb2e8e382301bac47fb18cb83924389717261cb1
    command: ["-nginx.scrape-uri=http://nginx:8080/__nginx_status"]
    tmpfs:
      - /tmp
    networks:
      - ops
      - edge
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  redis-exporter:
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    image: oliver006/redis_exporter:v1.63.0-alpine@sha256:9b5c975970aa768d3bed3c0b27bdda230aef445737c078dc35701e1e2984dc1b
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "{\"redis://cache:6379\": \"$$(cat /run/secrets/REDIS_PASSWORD)\"}" > /tmp/pwd.json
        exec /redis_exporter -redis.addr=redis://cache:6379 -redis.password-file=/tmp/pwd.json -config-command=-
    tmpfs:
      - /tmp
    secrets:
      - REDIS_PASSWORD
    networks:
      - internal
      - ops
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mysqld-exporter:
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    image: prom/mysqld-exporter:v0.15.1@sha256:7211a617ec657701ca819aa0ba28e1d5750f5bf2c1391b755cc4a48cc360b0fa
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf "[client]\nuser=l3mon_exporter\npassword=%s\nhost=db\nport=3306\n" "$$(cat /run/secrets/DB_EXPORTER_PASSWORD)" > /tmp/.my.cnf
        exec /bin/mysqld_exporter --config.my-cnf=/tmp/.my.cnf --mysqld.address=db:3306
    tmpfs:
      - /tmp
    secrets:
      - DB_EXPORTER_PASSWORD
    networks:
      - internal
      - ops
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # --- Host Metrics Profile ---
  node-exporter:
    profiles: [host-metrics]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "65534:65534"
    image: prom/node-exporter:v1.8.2@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/var/lib/node_exporter/textfile
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - ${BACKUP_METRICS_DIR:-../ops/backup}:/var/lib/node_exporter/textfile:ro
    tmpfs:
      - /tmp
    networks:
      - ops
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  cadvisor:
    profiles: [host-metrics]
    restart: unless-stopped
    init: true
    read_only: true
    security_opt: ["no-new-privileges:true"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    tmpfs:
      - /tmp
    networks:
      - ops
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  promtail:
    profiles: [host-metrics]
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: grafana/promtail:3.1.1@sha256:48fba41d9f08c6a56a85b078529dc8550a1809d3e7a9674982e9e9bfbdc854c1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../ops/promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/log/docker-containers:ro
    tmpfs:
      - /tmp
    networks:
      - ops
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mail_spool: {}
  prometheus_data: {}
  loki_data: {}

networks:
  ops:
    driver: bridge

secrets:
  MAIL_PASSWORD: { file: ../../.secrets/MAIL_PASSWORD }
  DISCORD_WEBHOOK_URL: { file: ../../.secrets/DISCORD_WEBHOOK_URL }
  GRAFANA_ADMIN_PASSWORD: { file: ../../.secrets/GRAFANA_ADMIN_PASSWORD }
  DB_EXPORTER_PASSWORD: { file: ../../.secrets/DB_EXPORTER_PASSWORD }
  REDIS_PASSWORD: { file: ../../.secrets/REDIS_PASSWORD }
