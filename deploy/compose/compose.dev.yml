# Development on one computer: nginx is published on the loopback address only, so nothing outside this machine can reach it.
services:
  ctfd:
    environment:
      # CTFd answers only for these host names; localhost is trusted here so a browser can use http://localhost:8080
      TRUSTED_HOSTS: "${PLATFORM_HOST},localhost"
  nginx:
    ports:
      - "127.0.0.1:${DEV_PORT:-8080}:8080"
    environment:
      EXTRA_HOST: localhost
