# Compose specification for standalone L3m0nCTF challenge hosts (SP4 / F4.1).
# Runs:
# 1. instancer service in agent mode (manages ephemeral container lifecycles via socket proxy)
# 2. docker-socket-proxy (strictly filtered Docker daemon socket interface)
# 3. router (Hop 2 HTTP reverse proxy and direct TCP relay)
#
# All security hardening keys are specified explicitly per container (no cross-file anchors).

name: l3mon-challenge-host

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3@sha256:9e4b9e7517a6b660f2cc903a19b257b1852d5b3344794e3ea334ff00ae677ac2
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    tmpfs:
      - /tmp
      - /run
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 1
      DELETE: 1
      INFO: 1
      VERSION: 1
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 1
      EXEC: 0
      GRPC: 0
      IMAGES: 0
      NODES: 0
      PLUGINS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
      SECRETS: 0
    networks:
      - challenge_net

  agent:
    image: l3mon/instancer:dev
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001:10001"
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ${INSTANCER_MANIFEST_FILE:-../../config/instancer/challenges.example.toml}:/etc/instancer/challenges.toml:ro
    ports:
      - "${HOST_PRIVATE_BIND_IP:-127.0.0.1}:8300:8300"
    secrets:
      - INSTANCER_TOKEN
      - ROUTER_TOKEN
    environment:
      INSTANCER_AGENT_MODE: "1"
      INSTANCER_HOST_NAME: "${CHALLENGE_HOST_NAME:-h1}"
      DOCKER_HOST: "tcp://socket-proxy:2375"
      INSTANCER_TOKEN_FILE: /run/secrets/INSTANCER_TOKEN
      ROUTER_TOKEN_FILE: /run/secrets/ROUTER_TOKEN
      INSTANCER_DEV: "${INSTANCER_DEV:-0}"
      MANIFEST_PATH: /etc/instancer/challenges.toml
      INSTANCE_DOMAIN: "${INSTANCE_DOMAIN:-inst.l3m0nctf.xyz}"
      INSTANCER_TCP_HOST: "${CHALLENGE_HOST_TCP_NAME:-h1.inst.l3m0nctf.xyz}"
      INSTANCER_TCP_PORT_START: "30000"
      INSTANCER_TCP_PORT_COUNT: "200"
      ROUTER_CONTAINER_NAME: l3mon-challenge-host-router-1
      INSTANCER_INSTANCE_POOL: "${INSTANCER_INSTANCE_POOL:-10.200.0.0/16}"
    networks:
      - challenge_net
    depends_on:
      - socket-proxy

  router:
    image: l3mon/instance-router:dev
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10002:10002"
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${HOST_PRIVATE_BIND_IP:-127.0.0.1}:${ROUTER_HTTP_PORT:-8080}:8090"
      - "0.0.0.0:30000-30199:30000-30199"
    secrets:
      - ROUTER_TOKEN
    environment:
      INSTANCER_URL: "http://agent:8300"
      ROUTER_TOKEN_FILE: /run/secrets/ROUTER_TOKEN
      INSTANCE_DOMAIN: "${INSTANCE_DOMAIN:-inst.l3m0nctf.xyz}"
      POLL_INTERVAL: "2.0"
      INSTANCER_INSTANCE_POOL: "${INSTANCER_INSTANCE_POOL:-10.200.0.0/16}"
      INSTANCER_TCP_PORT_START: "30000"
      INSTANCER_TCP_PORT_COUNT: "200"
    networks:
      - challenge_net
    depends_on:
      - agent

networks:
  challenge_net:
    name: l3mon_challenge_net
    driver: bridge

secrets:
  INSTANCER_TOKEN:
    file: ${INSTANCER_TOKEN_FILE_HOST:-../../.secrets/INSTANCER_TOKEN}
  ROUTER_TOKEN:
    file: ${ROUTER_TOKEN_FILE_HOST:-../../.secrets/ROUTER_TOKEN}
