# Redis for the platform: a cache and the session store. Reachable only on the internal network.
# The password is added on the command line from a secret file, never written here.
bind 0.0.0.0
port 6379
protected-mode yes

# A cache, not a database: nothing is written to disk.
save ""
appendonly no

# When memory runs out, drop keys that have a lifetime (cache entries and sessions) rather than refusing writes.
maxmemory 512mb
maxmemory-policy volatile-lru

# Slow-command log, to find anything that blocks.
slowlog-log-slower-than 10000
slowlog-max-len 128

# Dangerous commands nobody here needs. (FLUSHDB stays: the cache library falls back to it when a cache has no key prefix.)
rename-command CONFIG ""
rename-command DEBUG ""
