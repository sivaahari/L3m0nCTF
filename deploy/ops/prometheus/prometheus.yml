global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'ctfd'
    metrics_path: '/l3mon/metrics'
    static_configs:
      - targets: ['ctfd:8000']

  - job_name: 'mail-relay'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['mail-relay:9025']

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'mysqld-exporter'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'blackbox-readyz'
    metrics_path: /probe
    params:
      module: [http_readyz]
    static_configs:
      - targets: ['http://ctfd:8000/readyz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-ctftime'
    metrics_path: /probe
    params:
      module: [http_ctftime]
    static_configs:
      - targets: ['http://nginx:8080/ctftime/standings.json']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Host-level exporters (available when host-metrics profile is enabled)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Optional instancer metrics (harmless 0 targets if file does not exist)
  - job_name: 'instancer'
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/instancer.json
