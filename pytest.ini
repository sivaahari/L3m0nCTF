[pytest]
markers =
    integration: needs the running compose stack (tools/compose.sh up -d --wait)
    drill: the restore drill, which destroys the development data (needs --run-drill)
    overlays: needs the instancer and operations overlays running (L3MON_OVERLAYS=instancer,ops tools/compose.sh up -d --wait) and the age tool; skipped unless --run-overlays
