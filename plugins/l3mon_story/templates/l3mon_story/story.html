<!doctype html>
<html lang="{{ story.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<meta name="color-scheme" content="dark">
<title>{{ story.title }} · Cold open</title>
<link rel="stylesheet" href="/plugins/l3mon_story/assets/comic.css">
</head>
<body class="l3m-page">
<main id="l3m-stage" data-story-url="/api/v1/l3mon/story/{{ story.slug }}" data-slug="{{ story.slug }}" data-mode="page">
  <p class="l3m-loading">Tuning in…</p>
</main>
<section class="l3m-transcript" aria-labelledby="l3m-transcript-h">
  <h2 id="l3m-transcript-h">{{ story.title }} <span>{{ story.kicker }}</span></h2>
  <p>This is the same story as text.</p>
  <ol>
  {% for panel in story.transcript %}
    <li>
      <p class="l3m-alt">{{ panel.alt }}</p>
      {% for who, text, kind in panel.lines %}
      <p class="l3m-line l3m-{{ kind }}">{% if who %}<strong>{{ who }}:</strong> {% endif %}{{ text }}</p>
      {% endfor %}
    </li>
  {% endfor %}
  </ol>
</section>
<script type="module" src="/plugins/l3mon_story/assets/comic.js"></script>
</body>
</html>
